workflows:
  # =========================================================
  # 1. ANDROID RELEASE WORKFLOW (Manual Firebase App Distribution)
  # =========================================================
  flutter-android:
    name: Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_configuration
      vars:
        CONFIG_OUTPUT_PATH: "app_config.json"
      flutter: stable
      java: 17
    scripts:
      - name: Decode app_config
        script: |
          if [ -z "$APP_CONFIG_BASE64" ]; then
            echo "ERROR: Missing APP_CONFIG_BASE64 environment variable!"
            exit 1
          fi
          python3 -c "import base64, os; open(os.environ['CONFIG_OUTPUT_PATH'], 'wb').write(base64.b64decode(os.environ['APP_CONFIG_BASE64']))"

      - name: Install dependencies
        script: |
          flutter packages pub get

      - name: Build Android Release APK
        script: |
          flutter build apk --release \
            --dart-define-from-file="$CONFIG_OUTPUT_PATH" \
            --build-number="$BUILD_NUMBER"
    artifacts:
      - build/app/outputs/flutter-apk/*-release.apk
    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_APP_ID_ANDROID
          groups:
            - internal-testers

  # =========================================================
  # 2. IOS WORKFLOW (App Store Connect / TestFlight)
  # =========================================================
  flutter-ios:
    name: iOS App Store Connect Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_configuration
      vars:
        BUNDLE_ID: "com.adapt.adapt"
        CONFIG_OUTPUT_PATH: "app_config.json"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Decode Base64 app_config
        script: |
          python3 -c "import base64, os; open(os.environ['CONFIG_OUTPUT_PATH'], 'wb').write(base64.b64decode(os.environ['APP_CONFIG_BASE64']))"
          echo "Decoded config into $CONFIG_OUTPUT_PATH successfully."

      - name: Install dependencies & CocoaPods
        script: |
          flutter packages pub get
          find . -name "Podfile" -execdir pod install \;

      - name: Fetch iOS signing files
        script: |
          keychain initialize
          
          # 1. Decode Base64 key
          python3 -c "import base64, os; open('/tmp/AuthKey.p8', 'wb').write(base64.b64decode(os.environ['APP_STORE_CONNECT_PRIVATE_KEY_BASE64']))"
          export APP_STORE_CONNECT_PRIVATE_KEY=$(cat /tmp/AuthKey.p8)
          
          # 2. Export to CM_ENV for the publishing block (with an explicit newline)
          echo "APP_STORE_CONNECT_PRIVATE_KEY<<EOF" >> $CM_ENV
          cat /tmp/AuthKey.p8 >> $CM_ENV
          echo "" >> $CM_ENV
          echo "EOF" >> $CM_ENV
          
          # 3. Generate local RSA key for certificates
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            export CERTIFICATE_PRIVATE_KEY=$(openssl genrsa 2048)
          fi
          
          # 4. Fetch profiles passing credentials explicitly
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          
          keychain add-certificates
          xcode-project use-profiles

      - name: Auto-increment TestFlight build number
        script: |
          # Fetch the highest build number currently on TestFlight
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY")
          
          # If no build exists yet, default to 0
          if [ -z "$LATEST_BUILD" ]; then
            LATEST_BUILD=0
          fi
          
          # Increment by 1
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Latest TestFlight build is $LATEST_BUILD. Next build will be $NEW_BUILD."
          
          # Override the BUILD_NUMBER variable for the Flutter build step
          echo "BUILD_NUMBER=$NEW_BUILD" >> $CM_ENV

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --dart-define-from-file="$CONFIG_OUTPUT_PATH" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true